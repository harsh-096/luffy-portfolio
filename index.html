<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harsh Parmar — AI Systems &amp; Full-Stack Engineer</title>
    <meta name="description" content="Harsh Parmar is an AI Systems Engineer and Full-Stack Developer building autonomous AI agents, production RAG pipelines, and high-performance web products." />
    
    <!-- Fonts: Geist / Inter, JetBrains Mono, Silkscreen (Pixel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Anti-flash theme script -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var isDark =
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;

          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
